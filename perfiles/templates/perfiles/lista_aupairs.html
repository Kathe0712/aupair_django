<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Au Pairs</title>
</head>
<body>
    <h1>Perfiles de Au Pairs</h1>
    <ul>
        {% for aupair in aupairs %}
            <li>{{ aupair.nombre }} {{ aupair.apellido }} - {{ aupair.pais_origen }} - {{ aupair.edad }} años</li>
        {% endfor %}
    </ul>
</body>
</html>

<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Cerrar sesión</button>
</form>
