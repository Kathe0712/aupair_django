{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Au Pairs{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'perfiles/chatbot.css' %}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand">🌎 Au Pairs</span>
        </div>
    </nav>

    <div class="container">
        {% block contenido %}{% endblock %}
    </div>

    
        <button class="chat-bubble" id="chatToggle" aria-label="Abrir chat con el asistente">💬</button>

        <div class="chat-container" id="chatContainer" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
            <div class="chat-header">
                <span id="chatTitle">Asistente Au Pairs</span>
                <button class="close-btn" id="closeChat" aria-label="Cerrar chat">✖</button>
            </div>

            <div class="messages" id="messages" role="log" aria-live="polite"></div>

            <div class="input-area">
                <input type="text" id="userInput" aria-label="Escribe tu mensaje" placeholder="Escribe tu pregunta...">
                <button id="sendBtn">Enviar</button>
            </div>
        </div>

        <script src="{% static 'perfiles/chatbot.js' %}"></script>
    
</body>
</html>
